name: expense_tracker
description: "A personal finance tracker app built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  csv: ^6.0.0
  cupertino_icons: ^1.0.8
  fl_chart: ^0.68.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.0
  flutter_staggered_animations: ^1.1.1
  freezed_annotation: ^2.4.0
  get_it: ^7.7.0
  hive_ce: ^2.10.1
  hive_ce_flutter: ^2.2.0
  injectable: ^2.4.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  logger: ^2.4.0
  path_provider: ^2.1.3
  provider: ^6.1.2
  share_plus: ^9.0.0
  uuid: ^4.3.3

dev_dependencies:
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.0
  hive_ce_generator: ^1.8.0
  injectable_generator: ^2.6.0
  json_serializable: ^6.8.0
  very_good_analysis: ^6.0.0

# ── Native splash screen ──────────────────────────────────────────────────────
# Run after changing: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#1A237E"
  image: assets/images/logo.png
  android: true
  ios: true
  web: false

# ── Launcher icons ────────────────────────────────────────────────────────────
# Run after changing: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#1A237E"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
