name: expense_tracker
description: "A personal finance tracker app built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # State management
  provider: ^6.1.2

  # Charts
  fl_chart: ^0.68.0

  # Utils
  intl: ^0.20.2
  uuid: ^4.3.3
  cupertino_icons: ^1.0.8

  # Stage 3 — Polish
  flutter_native_splash: ^2.4.0
  flutter_staggered_animations: ^1.1.1
  path_provider: ^2.1.3
  share_plus: ^9.0.0
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.13.1

# ── Native splash screen ──────────────────────────────────────────────────────
# Run after changing: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#1A237E"
  image: assets/images/logo.png
  android: true
  ios: true
  web: false

# ── Launcher icons ────────────────────────────────────────────────────────────
# Run after changing: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#1A237E"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
